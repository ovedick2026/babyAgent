<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - SynapseMind</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(1200px 600px at 20% -10%, #1b2a4a 0%, #0b1120 55%, #070b14 100%);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: #e5eaf5;
    }
    .card {
      width: min(380px, 92vw);
      padding: 40px 36px 32px;
      background: rgba(17, 24, 39, .85);
      border: 1px solid rgba(99, 132, 255, .18);
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
    }
    .logo {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .logo .accent { color: #6f9bff; }
    .subtitle {
      text-align: center;
      font-size: 12px;
      color: #8b96ad;
      margin-bottom: 28px;
    }
    label {
      display: block;
      font-size: 13px;
      color: #aab4c8;
      margin-bottom: 8px;
    }
    input[type="password"] {
      width: 100%;
      padding: 11px 12px;
      font-size: 15px;
      color: #eef2ff;
      background: #0d1425;
      border: 1px solid #2a3a5e;
      border-radius: 8px;
      outline: none;
      transition: border-color .15s;
    }
    input[type="password"]:focus { border-color: #6f9bff; }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 11px 0;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #3b6cf0, #6f9bff);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: filter .15s;
    }
    button:hover { filter: brightness(1.1); }
    .error {
      margin-bottom: 18px;
      padding: 10px 12px;
      font-size: 13px;
      color: #ffb4b4;
      background: rgba(220, 60, 60, .12);
      border: 1px solid rgba(220, 80, 80, .35);
      border-radius: 8px;
    }
    .hint {
      margin-top: 22px;
      text-align: center;
      font-size: 11px;
      color: #5d6782;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Synapse<span class="accent">Mind</span></div>
    <div class="subtitle">神经认知图谱控制台</div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
      <label for="password">访问密码</label>
      <input type="password" id="password" name="password"
             placeholder="请输入管理密码" autocomplete="current-password" required autofocus>
      <button type="submit">登 录</button>
    </form>

    <div class="hint">密码在设置页中配置，错误尝试将被记录</div>
  </div>
</body>
</html>
