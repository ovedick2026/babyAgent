<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置 - SynapseMind</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: radial-gradient(1200px 600px at 20% -10%, #1b2a4a 0%, #0b1120 55%, #070b14 100%);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: #e5eaf5;
      padding: 28px 16px 60px;
    }
    .wrap { max-width: 880px; margin: 0 auto; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 26px;
    }
    .logo { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
    .logo .accent { color: #6f9bff; }
    nav a {
      margin-left: 14px; color: #8fa3c8; text-decoration: none; font-size: 13px;
    }
    nav a:hover { color: #cdd9f2; }
    .card {
      background: rgba(17, 24, 39, .85);
      border: 1px solid rgba(99, 132, 255, .18);
      border-radius: 12px;
      padding: 22px 24px;
      margin-bottom: 18px;
    }
    .card h2 {
      font-size: 15px; font-weight: 600; color: #9fc0ff;
      margin-bottom: 14px; letter-spacing: .5px;
    }
    .modes { display: flex; gap: 10px; flex-wrap: wrap; }
    .mode {
      flex: 1 1 200px; padding: 12px 14px;
      background: #0d1425; border: 1px solid #2a3a5e; border-radius: 10px;
      cursor: pointer; transition: border-color .15s, background .15s;
    }
    .mode:hover { border-color: #4a6cb0; }
    .mode.on { border-color: #6f9bff; background: #14213d; }
    .mode b { display: block; font-size: 14px; margin-bottom: 4px; }
    .mode span { font-size: 12px; color: #8b96ad; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
    label { display: block; font-size: 12px; color: #aab4c8; margin-bottom: 5px; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 9px 11px; font-size: 13px; color: #eef2ff;
      background: #0d1425; border: 1px solid #2a3a5e; border-radius: 8px; outline: none;
    }
    input:focus { border-color: #6f9bff; }
    button {
      padding: 8px 16px; font-size: 13px; font-weight: 600; color: #fff;
      background: linear-gradient(135deg, #3b6cf0, #6f9bff);
      border: none; border-radius: 8px; cursor: pointer;
    }
    button:hover { filter: brightness(1.12); }
    button.ghost { background: #1a2540; border: 1px solid #33477a; }
    button.danger { background: #7a2f3a; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
    .row > div { flex: 1 1 180px; }
    .actions { margin-top: 14px; display: flex; gap: 10px; align-items: center; }
    .msg { font-size: 12px; margin-left: 6px; }
    .msg.ok { color: #7fe3a0; }
    .msg.err { color: #ff9b9b; }
    .snap-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .snap-col { background: #0d1425; border: 1px solid #2a3a5e; border-radius: 10px; padding: 12px 14px; }
    .snap-col h3 {
      font-size: 13px; color: #cdd9f2; margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .snap-col h3 .cnt { font-size: 11px; color: #8b96ad; }
    .snap-col ul { list-style: none; }
    .snap-col li {
      font-size: 11px; color: #9aa7c4; padding: 4px 0;
      border-top: 1px dashed #22304f; word-break: break-all;
    }
    .snap-col .empty { color: #5d6782; font-size: 12px; padding: 6px 0; }
    .switch { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #aab4c8; }
    .switch input { accent-color: #6f9bff; }
    #tokenOnce {
      margin-top: 10px; padding: 9px 11px; font-size: 12px; display: none;
      color: #ffe2a8; background: rgba(240, 180, 60, .1);
      border: 1px solid rgba(240, 180, 60, .35); border-radius: 8px; word-break: break-all;
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Synapse<span class="accent">Mind</span> · 设置</div>
    <nav><a href="/">← 返回控制台</a></nav>
  </header>

  <!-- 运行模式 -->
  <div class="card">
    <h2>运行模式</h2>
    <div class="modes" id="modes">
      <div class="mode" data-mode="manual"><b>① 纯手工</b><span>零 LLM，全部知识手工录入，推演 100% 确定性</span></div>
      <div class="mode" data-mode="assisted"><b>② AI 辅助</b><span>LLM 速读资料产出突触提案，人工确认后入库</span></div>
      <div class="mode" data-mode="augmented"><b>③ AI 增强</b><span>LLM 参与复杂诉求的分步辨证规划</span></div>
    </div>
    <div class="actions">
      <button id="btnMode">保存模式</button><span class="msg" id="msgMode"></span>
    </div>
  </div>

  <!-- 安全 -->
  <div class="card">
    <h2>安全</h2>
    <div class="row">
      <div>
        <label>设置 / 修改登录密码</label>
        <input type="password" id="pwd1" placeholder="新密码（≥6 位）" autocomplete="new-password">
      </div>
      <div>
        <label>确认新密码</label>
        <input type="password" id="pwd2" placeholder="再次输入" autocomplete="new-password">
      </div>
      <div style="flex:0 0 auto"><button id="btnPwd">保存密码</button></div>
    </div>
    <div class="row" style="margin-top:14px">
      <div><label>API Token（OpenAI 兼容端点 Bearer 凭证）</label>
        <input type="text" id="tokenView" value="········（隐藏）" readonly></div>
      <div style="flex:0 0 auto"><button class="danger" id="btnToken">轮换 Token</button></div>
    </div>
    <div id="tokenOnce">⚠ 新 Token 仅此一次显示，请立即保存：<b id="tokenVal"></b></div>
    <span class="msg" id="msgSec"></span>
  </div>

  <!-- LLM 连接 -->
  <div class="card">
    <h2>LLM 连接（OpenAI 兼容 /chat/completions）</h2>
    <div class="row">
      <div><label>Base URL</label><input type="text" id="llm_base" placeholder="https://api.example.com/v1"></div>
      <div><label>API Key</label><input type="password" id="llm_key" placeholder="sk-..."></div>
      <div><label>模型名</label><input type="text" id="llm_model" placeholder="gpt-4o-mini"></div>
    </div>
    <div class="actions"><button id="btnLlm">保存 LLM 配置</button><span class="msg" id="msgLlm"></span></div>
  </div>

  <!-- S3 连接 -->
  <div class="card">
    <h2>S3 对象存储（兼容 R2 / OSS / MinIO）</h2>
    <div class="row">
      <div><label>Endpoint URL</label><input type="text" id="s3_endpoint" placeholder="https://xxx.r2.cloudflarestorage.com"></div>
      <div><label>Bucket</label><input type="text" id="s3_bucket" placeholder="synapsemind"></div>
    </div>
    <div class="row" style="margin-top:12px">
      <div><label>Access Key ID</label><input type="text" id="s3_ak"></div>
      <div><label>Secret Access Key</label><input type="password" id="s3_sk"></div>
    </div>
    <div class="actions"><button id="btnS3">保存 S3 配置</button><span class="msg" id="msgS3"></span></div>
  </div>

  <!-- 备份与快照 -->
  <div class="card">
    <h2>备份快照（manual / hourly / daily 各保留 ≤3 份）</h2>
    <div class="row" style="margin-bottom:14px">
      <label class="switch"><input type="checkbox" id="bp_hourly"> 每小时自动备份</label>
      <label class="switch"><input type="checkbox" id="bp_daily"> 每日自动备份</label>
      <button class="ghost" id="btnPolicy" style="padding:6px 12px">保存备份策略</button>
      <button class="ghost" id="btnRefresh" style="padding:6px 12px">刷新快照列表</button>
      <span class="msg" id="msgBp"></span>
    </div>
    <div class="snap-cols">
      <div class="snap-col"><h3>手动备份 <span class="cnt" id="cnt_manual"></span></h3><ul id="list_manual"></ul>
        <div class="actions" style="margin-top:8px">
          <button style="padding:6px 12px" id="btnBackup">立即备份</button>
          <button class="ghost" style="padding:6px 12px" data-restore="manual">恢复最新</button>
        </div>
      </div>
      <div class="snap-col"><h3>每小时备份 <span class="cnt" id="cnt_hourly"></span></h3><ul id="list_hourly"></ul>
        <div class="actions" style="margin-top:8px">
          <button class="ghost" style="padding:6px 12px" data-restore="hourly">恢复最新</button>
        </div>
      </div>
      <div class="snap-col"><h3>每日备份 <span class="cnt" id="cnt_daily"></span></h3><ul id="list_daily"></ul>
        <div class="actions" style="margin-top:8px">
          <button class="ghost" style="padding:6px 12px" data-restore="daily">恢复最新</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const setMsg = (id, text, ok) => { const el = $(id); el.textContent = text; el.className = 'msg ' + (ok ? 'ok' : 'err'); };

async function api(path, opts = {}) {
  const resp = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    credentials: 'same-origin', ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (resp.status === 401) { location.href = '/login'; throw new Error('未登录'); }
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.detail || ('HTTP ' + resp.status));
  return data;
}

let currentMode = 'manual';
document.querySelectorAll('.mode').forEach(el => {
  el.addEventListener('click', () => {
    currentMode = el.dataset.mode;
    document.querySelectorAll('.mode').forEach(m => m.classList.toggle('on', m === el));
  });
});

$('btnMode').addEventListener('click', async () => {
  try { await api('/settings/api/mode', { method: 'POST', body: { mode: currentMode } });
        setMsg('msgMode', '✓ 已保存', true); } catch (e) { setMsg('msgMode', '✗ ' + e.message, false); }
});

$('btnPwd').addEventListener('click', async () => {
  if ($('pwd1').value.length < 6) return setMsg('msgSec', '✗ 密码至少 6 位', false);
  if ($('pwd1').value !== $('pwd2').value) return setMsg('msgSec', '✗ 两次输入不一致', false);
  try { await api('/settings/api/password', { method: 'POST', body: { password: $('pwd1').value } });
        $('pwd1').value = $('pwd2').value = ''; setMsg('msgSec', '✓ 密码已更新', true); }
  catch (e) { setMsg('msgSec', '✗ ' + e.message, false); }
});

$('btnToken').addEventListener('click', async () => {
  if (!confirm('轮换后旧 Token 立即失效，已接入的客户端需更新，确认？')) return;
  try { const d = await api('/settings/api/token', { method: 'POST' });
        $('tokenVal').textContent = d.token; $('tokenOnce').style.display = 'block';
        setMsg('msgSec', '', true); } catch (e) { setMsg('msgSec', '✗ ' + e.message, false); }
});

$('btnLlm').addEventListener('click', async () => {
  try { await api('/settings/api/llm', { method: 'POST', body: {
    base_url: $('llm_base').value.trim(), api_key: $('llm_key').value.trim(), model: $('llm_model').value.trim() }});
    setMsg('msgLlm', '✓ 已保存', true); } catch (e) { setMsg('msgLlm', '✗ ' + e.message, false); }
});

$('btnS3').addEventListener('click', async () => {
  try { await api('/settings/api/s3', { method: 'POST', body: {
    endpoint_url: $('s3_endpoint').value.trim(), access_key_id: $('s3_ak').value.trim(),
    secret_access_key: $('s3_sk').value.trim(), bucket: $('s3_bucket').value.trim() }});
    setMsg('msgS3', '✓ 已保存', true); } catch (e) { setMsg('msgS3', '✗ ' + e.message, false); }
});

$('btnPolicy').addEventListener('click', async () => {
  try { await api('/settings/api/backup_policy', { method: 'POST', body: {
    hourly_enabled: $('bp_hourly').checked, daily_enabled: $('bp_daily').checked }});
    setMsg('msgBp', '✓ 策略已保存', true); } catch (e) { setMsg('msgBp', '✗ ' + e.message, false); }
});

$('btnBackup').addEventListener('click', async (ev) => {
  ev.target.disabled = true; setMsg('msgBp', '备份中…', true);
  try { await api('/settings/api/backup', { method: 'POST' });
        setMsg('msgBp', '✓ 手动备份完成', true); await loadSnaps(); }
  catch (e) { setMsg('msgBp', '✗ ' + e.message, false); }
  finally { ev.target.disabled = false; }
});

document.querySelectorAll('[data-restore]').forEach(btn => {
  btn.addEventListener('click', async () => {
    const kind = btn.dataset.restore;
    if (!confirm(`确认从云端「${kind}」最新快照恢复？本地将被覆盖！`)) return;
    btn.disabled = true; setMsg('msgBp', '恢复中…', true);
    try { await api('/settings/api/restore', { method: 'POST', body: { kind } });
          setMsg('msgBp', `✓ 已从 ${kind} 快照恢复（重启后生效完整自愈）`, true); }
    catch (e) { setMsg('msgBp', '✗ ' + e.message, false); }
    finally { btn.disabled = false; }
  });
});

async function loadSnaps() {
  try {
    const d = await api('/settings/api/snapshots');
    for (const kind of ['manual', 'hourly', 'daily']) {
      const items = d[kind] || [];
      $('cnt_' + kind).textContent = items.length + '/3';
      $('list_' + kind).innerHTML = items.length
        ? items.map(k => `<li>${k}</li>`).join('')
        : '<li class="empty">暂无快照</li>';
    }
  } catch (e) { setMsg('msgBp', '✗ 快照列表加载失败: ' + e.message, false); }
}

(async function boot() {
  try {
    const d = await api('/settings/api');
    currentMode = d.mode || 'manual';
    document.querySelectorAll('.mode').forEach(m => m.classList.toggle('on', m.dataset.mode === currentMode));
    $('llm_base').value = d.llm.base_url || ''; $('llm_model').value = d.llm.model || '';
    $('llm_key').placeholder = d.llm.has_key ? '已配置（留空则不修改）' : 'sk-...';
    $('s3_endpoint').value = d.s3.endpoint_url || ''; $('s3_bucket').value = d.s3.bucket || '';
    $('s3_ak').value = d.s3.access_key_id || '';
    $('s3_sk').placeholder = d.s3.has_secret ? '已配置（留空则不修改）' : '';
    $('bp_hourly').checked = !!d.backup_policy.hourly_enabled;
    $('bp_daily').checked = !!d.backup_policy.daily_enabled;
  } catch (e) { console.error('boot 失败', e); }
  await loadSnaps();
})();
</script>
</body>
</html>
